[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergelane"
version = "0.3.0"
description = "A risk-controlled fast lane for AI-written pull requests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = ["datasets>=2.19", "pyarrow>=15"]
model = ["lightgbm>=4.3"]
dev = ["pytest>=8"]

[project.scripts]
mergelane = "mergelane.action:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mergelane = ["model/*.txt", "model/*.json", "model/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
