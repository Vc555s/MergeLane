name: MergeLane
description: Labels AI-agent pull requests as fast lane or full review, with a calibrated risk budget.
author: Vc555s
branding:
  icon: git-merge
  color: green
inputs:
  command:
    description: "check (label the current PR) or audit (check the fast lane against its budget)."
    default: check
  risk-budget:
    description: "Highest share of fast-tracked PRs allowed to need a revert or follow-up fix: 0.01, 0.02 or 0.05."
    default: "0.01"
  labels:
    description: "Add a 'mergelane: fast-track' or 'mergelane: review' label."
    default: "true"
  comment:
    description: "Post (and keep updated) one comment explaining the decision."
    default: "true"
  agent:
    description: "Override agent detection (Claude_Code, Copilot, Cursor, Devin, Google_Jules, OpenAI_Codex)."
    default: ""
  fail-on-breach:
    description: "audit only: fail the job when the fast lane is over budget."
    default: "false"
  github-token:
    description: "Token with pull-requests: write and issues: write."
    default: ${{ github.token }}
outputs:
  lane:
    description: "fast-track, review or not-agent (check)."
    value: ${{ steps.run.outputs.lane }}
  score:
    description: "Predicted chance of a revert or follow-up fix (check)."
    value: ${{ steps.run.outputs.score }}
  verdict:
    description: "holds, watch, not-enough-data or breached (audit)."
    value: ${{ steps.run.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install MergeLane
      shell: bash
      run: |
        python -m pip install --quiet --disable-pip-version-check "lightgbm>=4.3" "scikit-learn>=1.4"
        python -m pip install --quiet --disable-pip-version-check --no-deps "${{ github.action_path }}"
    - id: run
      name: Run MergeLane
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_RISK_BUDGET: ${{ inputs.risk-budget }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_AGENT: ${{ inputs.agent }}
        INPUT_FAIL_ON_BREACH: ${{ inputs.fail-on-breach }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python -m mergelane.action
